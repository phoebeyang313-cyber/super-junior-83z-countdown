<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#12051f">
    <meta name="description" content="SUPER JUNIOR 83Z FANCON TOUR [1983] 澳门场倒计时">

    <title>SUPER JUNIOR 83Z · 澳门场倒计时</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(157, 78, 221, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(91, 33, 182, 0.3),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #08020f 0%,
                    #160622 45%,
                    #0c0316 100%
                );
        }

        /* =========================
           星空
        ========================= */

        .stars {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);

            animation-name: twinkle;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* =========================
           背景光晕
        ========================= */

        .glow {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }

        .glow.one {
            top: -180px;
            left: -120px;
            background: #b56cff;
        }

        .glow.two {
            right: -180px;
            bottom: -180px;
            background: #6d28d9;
        }

        /* =========================
           主容器
        ========================= */

        .page {
            position: relative;
            z-index: 2;

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .card {
            position: relative;

            width: min(900px, 100%);

            padding: 58px 55px 45px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;

            background: rgba(255, 255, 255, 0.07);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* =========================
           顶部
        ========================= */

        .hero-image {
            display: block;
            width: 100%;
            height: auto;
            margin: -20px auto 30px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.24);
        }

        .brand {
            text-align: center;
            margin-bottom: 8px;

            font-size: clamp(30px, 6vw, 56px);
            font-weight: 800;
            letter-spacing: 0.12em;

            text-shadow:
                0 0 25px rgba(255, 255, 255, 0.2);
        }

        .subtitle {
            text-align: center;

            font-size: 14px;
            letter-spacing: 0.32em;

            color: rgba(255, 255, 255, 0.62);

            margin-bottom: 28px;
        }

        .macau {
            text-align: center;

            font-size: 14px;
            font-weight: 600;

            letter-spacing: 0.45em;

            color: rgba(255, 255, 255, 0.82);

            margin-bottom: 42px;
        }

        .macau span {
            display: inline-block;
            margin-left: 0.45em;
        }

        /* =========================
           倒计时
        ========================= */

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 42px;
        }

        .time-box {
            position: relative;

            padding: 24px 12px 20px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(255, 255, 255, 0.09);

            text-align: center;

            overflow: hidden;
        }

        .time-box::before {
            content: "";

            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;

            height: 1px;

            background: rgba(255, 255, 255, 0.3);
        }

        .number {
            display: block;

            font-size: clamp(36px, 6vw, 64px);

            font-weight: 700;

            line-height: 1;

            letter-spacing: 0.04em;

            font-variant-numeric: tabular-nums;

            text-shadow:
                0 0 25px rgba(255, 255, 255, 0.12);
        }

        .label {
            display: block;

            margin-top: 12px;

            font-size: 11px;

            letter-spacing: 0.28em;

            color: rgba(255, 255, 255, 0.48);
        }

        /* =========================
           信息
        ========================= */

        .info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 30px;
        }

        .info-item {
            text-align: center;

            padding: 15px 10px;

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.035);

            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .info-title {
            display: block;

            font-size: 10px;

            letter-spacing: 0.2em;

            color: rgba(255, 255, 255, 0.4);

            margin-bottom: 7px;
        }

        .info-content {
            display: block;

            font-size: 13px;

            color: rgba(255, 255, 255, 0.85);

            line-height: 1.5;
        }

        /* =========================
           备忘录
        ========================= */

        .memo {
            margin-top: 30px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.045);
        }

        .memo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .memo-title {
            font-size: 11px;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.72);
        }

        .memo-hint {
            margin: -5px 0 12px;
            color: rgba(255, 255, 255, 0.42);
            font-size: 10px;
        }

        .memo-status {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.42);
        }

        .memo-form {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
        }

        .memo-input {
            min-width: 0;
            flex: 1;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.14);
            font: inherit;
            font-size: 13px;
        }

        .memo-input::placeholder {
            color: rgba(255, 255, 255, 0.32);
        }

        .memo-input:focus {
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        .memo-add,
        .memo-clear {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            color: rgba(255, 255, 255, 0.76);
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            font: inherit;
            font-size: 10px;
        }

        .memo-add {
            flex: 0 0 auto;
            padding: 0 13px;
        }

        .memo-options {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            grid-column: 1 / -1;
            gap: 8px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 10px;
        }

        .memo-time-label {
            color: rgba(255, 255, 255, 0.42);
        }

        .memo-reminder-toggle,
        .memo-check {
            accent-color: #b56cff;
            cursor: pointer;
        }

        .memo-time {
            min-width: 170px;
            padding: 5px 7px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.72);
            background: rgba(0, 0, 0, 0.14);
            font: inherit;
            font-size: 10px;
        }

        .memo-add:hover,
        .memo-clear:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.35);
        }

        .memo-list {
            display: grid;
            gap: 7px;
            margin: 12px 0 0;
            padding: 0;
            list-style: none;
        }

        .memo-item {
            display: grid;
            gap: 6px;
            padding: 7px 9px;
            border-radius: 9px;
            background: rgba(0, 0, 0, 0.13);
        }

        .memo-item-main {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .memo-check {
            width: 17px;
            height: 17px;
            flex: 0 0 auto;
        }

        .memo-text {
            flex: 1;
            min-width: 0;
            color: rgba(255, 255, 255, 0.86);
            font-size: 13px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .memo-item.completed .memo-text {
            color: rgba(255, 255, 255, 0.38);
            text-decoration: line-through;
        }

        .memo-delete {
            flex: 0 0 auto;
            padding: 3px 6px;
            border: 0;
            color: rgba(255, 255, 255, 0.38);
            background: transparent;
            cursor: pointer;
            font: inherit;
            font-size: 16px;
            line-height: 1;
        }

        .memo-delete:hover {
            color: #ffffff;
        }

        .memo-item-reminder {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
            padding-left: 27px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 10px;
        }

        .memo-reminder-label {
            color: rgba(255, 255, 255, 0.62);
        }

        .memo-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .memo-clear {
            padding: 6px 10px;
            color: rgba(255, 255, 255, 0.62);
            background: transparent;
        }

        /* =========================
           底部文字
        ========================= */

        .message {
            text-align: center;

            font-size: 14px;

            letter-spacing: 0.12em;

            color: rgba(255, 255, 255, 0.62);

            transition: all 0.3s ease;
        }

        .message.active {
            color: #ffffff;

            font-size: 18px;

            font-weight: 600;

            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.35);
        }

        .footer {
            text-align: center;

            margin-top: 30px;

            font-size: 10px;

            letter-spacing: 0.2em;

            color: rgba(255, 255, 255, 0.25);
        }

        /* =========================
           手机端
        ========================= */

        @media (max-width: 650px) {

            body {
                overflow: auto;
            }

            .page {
                min-height: 100vh;
                padding: 18px;
            }

            .card {
                padding: 42px 18px 32px;

                border-radius: 24px;
            }

            .brand {
                font-size: 31px;
                letter-spacing: 0.08em;
            }

            .hero-image {
                margin-top: -10px;
                margin-bottom: 24px;
                border-radius: 12px;
            }

            .subtitle {
                font-size: 10px;
                letter-spacing: 0.2em;
                margin-bottom: 22px;
            }

            .macau {
                font-size: 12px;
                letter-spacing: 0.3em;
                margin-bottom: 30px;
            }

            .countdown {
                gap: 8px;
                margin-bottom: 28px;
            }

            .time-box {
                padding: 18px 4px 15px;
                border-radius: 14px;
            }

            .number {
                font-size: clamp(27px, 9vw, 42px);
            }

            .label {
                margin-top: 9px;
                font-size: 8px;
                letter-spacing: 0.15em;
            }

            .info {
                gap: 7px;
            }

            .info-item {
                padding: 12px 5px;
                border-radius: 11px;
            }

            .info-title {
                font-size: 8px;
                margin-bottom: 5px;
            }

            .info-content {
                font-size: 10px;
            }

            .memo {
                padding: 14px;
                margin-top: 24px;
            }

            .memo-form {
                gap: 6px;
            }

            .memo-time {
                min-width: 155px;
            }

            .memo-add {
                padding: 0 10px;
            }

            .message {
                font-size: 12px;
            }

            .footer {
                margin-top: 24px;
                font-size: 8px;
            }
        }

        @media (max-width: 380px) {

            .card {
                padding-left: 13px;
                padding-right: 13px;
            }

            .number {
                font-size: 25px;
            }

            .label {
                font-size: 7px;
            }
        }
    </style>
</head>

<body>

    <!-- 星空 -->
    <div class="stars" id="stars"></div>

    <!-- 背景光晕 -->
    <div class="glow one"></div>
    <div class="glow two"></div>

    <main class="page">

        <section class="card">

            <img
                class="hero-image"
                src="微信图片_20260914140956_325_92.png"
                alt="SUPER JUNIOR 83Z 两位成员在蓝天下的照片"
            >

            <!-- 标题 -->
            <div class="brand">
                SUPER JUNIOR
            </div>

            <div class="subtitle">
                2026 FANCON TOUR [1983]
            </div>

            <div class="macau">
                MACAU <span>·</span> 澳门
            </div>

            <!-- 倒计时 -->
            <div class="countdown">

                <div class="time-box">
                    <span class="number" id="days">00</span>
                    <span class="label">DAYS</span>
                </div>

                <div class="time-box">
                    <span class="number" id="hours">00</span>
                    <span class="label">HOURS</span>
                </div>

                <div class="time-box">
                    <span class="number" id="minutes">00</span>
                    <span class="label">MINUTES</span>
                </div>

                <div class="time-box">
                    <span class="number" id="seconds">00</span>
                    <span class="label">SECONDS</span>
                </div>

            </div>

            <!-- 演出信息 -->
            <div class="info">

                <div class="info-item">
                    <span class="info-title">DATE</span>
                    <span class="info-content">
                        2026年9月19日
                    </span>
                </div>

                <div class="info-item">
                    <span class="info-title">LOCATION</span>
                    <span class="info-content">
                        澳门新濠影汇综艺馆
                    </span>
                </div>

                <div class="info-item">
                    <span class="info-title">83Z</span>
                    <span class="info-content">
                        Leeteuk & Heechul
                    </span>
                </div>

            </div>

            <!-- 提示 -->
            <div class="message" id="message">
                期待与你相见 ✦
            </div>

            <!-- 个人备忘录 -->
            <section class="memo" aria-labelledby="memo-title">
                <div class="memo-header">
                    <span class="memo-title" id="memo-title">个人备忘录</span>
                    <span class="memo-status" id="memo-status" aria-live="polite">自动保存</span>
                </div>

                <p class="memo-hint">每条事项都可以单独设置提醒时间</p>

                <form class="memo-form" id="memo-form">
                    <input
                        class="memo-input"
                        id="memo-input"
                        maxlength="160"
                        placeholder="添加一件要记住的事……"
                        aria-label="新增备忘录项目"
                    >
                    <button class="memo-add" type="submit">添加</button>
                    <div class="memo-options">
                        <label>
                            <input
                                class="memo-reminder-toggle"
                                id="memo-reminder-toggle"
                                type="checkbox"
                            >
                            需要提醒
                        </label>
                        <span class="memo-time-label">提醒时间</span>
                        <input
                            class="memo-time"
                            id="memo-reminder-time"
                            type="datetime-local"
                            aria-label="新增事项提醒时间"
                        >
                    </div>
                </form>

                <ul class="memo-list" id="memo-list" aria-live="polite"></ul>

                <div class="memo-actions">
                    <button class="memo-clear" id="memo-clear" type="button">清空全部</button>
                </div>
            </section>

            <div class="footer">
                ALWAYS TOGETHER · 83Z
            </div>

        </section>

    </main>

    <script>

        /* =====================================================
           澳门场目标时间

           当前使用：
           2026年9月19日 00:00（澳门时间）

           如果之后确认官方开场时间，例如 19:30，
           只需要修改下面这一行：

           "2026-09-19T19:30:00+08:00"
        ===================================================== */

        const concertDate =
            new Date("2026-09-19T00:00:00+08:00").getTime();


        /* =====================================================
           星空生成
        ===================================================== */

        const starsContainer =
            document.getElementById("stars");

        const starCount = 100;

        for (let i = 0; i < starCount; i++) {

            const star = document.createElement("div");

            star.className = "star";

            const size =
                Math.random() < 0.85
                    ? Math.random() * 1.5 + 0.5
                    : Math.random() * 2.5 + 1;

            star.style.width = `${size}px`;
            star.style.height = `${size}px`;

            star.style.left =
                `${Math.random() * 100}%`;

            star.style.top =
                `${Math.random() * 100}%`;

            star.style.opacity =
                `${Math.random() * 0.7 + 0.2}`;

            star.style.animationDuration =
                `${Math.random() * 3 + 2}s`;

            star.style.animationDelay =
                `${Math.random() * 4}s`;

            starsContainer.appendChild(star);
        }


        /* =====================================================
           倒计时
        ===================================================== */

        const daysElement =
            document.getElementById("days");

        const hoursElement =
            document.getElementById("hours");

        const minutesElement =
            document.getElementById("minutes");

        const secondsElement =
            document.getElementById("seconds");

        const messageElement =
            document.getElementById("message");

        const memoForm =
            document.getElementById("memo-form");

        const memoInput =
            document.getElementById("memo-input");

        const memoReminderToggle =
            document.getElementById("memo-reminder-toggle");

        const memoReminderTime =
            document.getElementById("memo-reminder-time");

        const memoList =
            document.getElementById("memo-list");

        const memoStatus =
            document.getElementById("memo-status");

        const memoClear =
            document.getElementById("memo-clear");

        const memoStorageKey =
            "super-junior-83z-countdown-memo-list";

        let memoItems = [];


        function pad(number) {
            return String(number).padStart(2, "0");
        }


        function saveMemo() {

            try {
                localStorage.setItem(
                    memoStorageKey,
                    JSON.stringify(memoItems)
                );
                memoStatus.textContent = "已自动保存";
            } catch (error) {
                memoStatus.textContent = "仅保留在本次开启";
            }
        }


        try {
            const savedItems =
                localStorage.getItem(memoStorageKey);

            if (savedItems) {
                const parsedItems = JSON.parse(savedItems);
                memoItems = Array.isArray(parsedItems) ? parsedItems : [];
            } else {
                const oldMemo =
                    localStorage.getItem("super-junior-83z-countdown-memo");

                if (oldMemo && oldMemo.trim()) {
                    memoItems = [{
                        id: Date.now(),
                        text: oldMemo.trim(),
                        completed: false,
                        remind: false,
                        remindAt: ""
                    }];
                }
            }
        } catch (error) {
            memoStatus.textContent = "仅保留在本次开启";
        }

        function renderMemo() {

            memoList.textContent = "";

            memoItems.forEach((item) => {
                const listItem = document.createElement("li");
                listItem.className = "memo-item";

                if (item.completed) {
                    listItem.classList.add("completed");
                }

                const checkbox = document.createElement("input");
                checkbox.className = "memo-check";
                checkbox.type = "checkbox";
                checkbox.checked = item.completed;
                checkbox.setAttribute("aria-label", `完成：${item.text}`);

                checkbox.addEventListener("change", () => {
                    item.completed = checkbox.checked;
                    renderMemo();
                    saveMemo();
                });

                const text = document.createElement("span");
                text.className = "memo-text";
                text.textContent = item.text;

                const reminderControls = document.createElement("div");
                reminderControls.className = "memo-item-reminder";

                const reminderToggle = document.createElement("input");
                reminderToggle.className = "memo-reminder-toggle";
                reminderToggle.type = "checkbox";
                reminderToggle.checked = Boolean(item.remind && item.remindAt);
                reminderToggle.setAttribute("aria-label", `提醒：${item.text}`);

                const reminderLabel = document.createElement("span");
                reminderLabel.className = "memo-reminder-label";
                reminderLabel.textContent = "提醒我";

                const reminderTime = document.createElement("input");
                reminderTime.className = "memo-time";
                reminderTime.type = "datetime-local";
                reminderTime.value = item.remindAt || "";
                reminderTime.setAttribute("aria-label", `提醒时间：${item.text}`);

                reminderToggle.addEventListener("change", async () => {
                    if (reminderToggle.checked && !reminderTime.value) {
                        reminderToggle.checked = false;
                        memoStatus.textContent = "请先选择提醒时间";
                        reminderTime.focus();
                        return;
                    }

                    item.remind = reminderToggle.checked;
                    item.notified = false;
                    await requestNotificationPermission();
                    saveMemo();
                });

                reminderTime.addEventListener("change", async () => {
                    item.remindAt = reminderTime.value;
                    if (reminderTime.value) {
                        reminderToggle.checked = true;
                    }
                    item.remind = Boolean(reminderTime.value);
                    item.notified = false;
                    await requestNotificationPermission();
                    saveMemo();
                });

                reminderControls.append(
                    reminderToggle,
                    reminderLabel,
                    reminderTime
                );

                const deleteButton = document.createElement("button");
                deleteButton.className = "memo-delete";
                deleteButton.type = "button";
                deleteButton.textContent = "×";
                deleteButton.setAttribute("aria-label", `删除：${item.text}`);

                deleteButton.addEventListener("click", () => {
                    memoItems = memoItems.filter(
                        (memoItem) => memoItem.id !== item.id
                    );
                    renderMemo();
                    saveMemo();
                });

                const itemMain = document.createElement("div");
                itemMain.className = "memo-item-main";
                itemMain.append(checkbox, text, deleteButton);

                listItem.append(itemMain, reminderControls);
                memoList.appendChild(listItem);
            });
        }

        async function requestNotificationPermission() {

            if (typeof Notification === "undefined" || Notification.permission !== "default") {
                return;
            }

            try {
                await Notification.requestPermission();
            } catch (error) {
                memoStatus.textContent = "页面内提醒已开启";
            }
        }

        memoReminderTime.addEventListener("change", () => {
            if (memoReminderTime.value) {
                memoReminderToggle.checked = true;
            }
        });

        function checkReminders() {

            const now = Date.now();
            let reminderTriggered = false;

            memoItems.forEach((item) => {
                const reminderTime = new Date(item.remindAt).getTime();

                if (
                    item.remind &&
                    !item.completed &&
                    !item.notified &&
                    item.remindAt &&
                    reminderTime <= now
                ) {
                    item.notified = true;
                    reminderTriggered = true;

                    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
                        new Notification("备忘录提醒", { body: item.text });
                    }
                }
            });

            if (reminderTriggered) {
                memoStatus.textContent = "有一项备忘录需要注意";
                saveMemo();
            }
        }

        memoForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const text = memoInput.value.trim();

            if (!text) {
                memoInput.focus();
                return;
            }

            if (memoReminderToggle.checked && !memoReminderTime.value) {
                memoStatus.textContent = "请先选择提醒时间";
                memoReminderTime.focus();
                return;
            }

            memoItems.push({
                id: Date.now(),
                text,
                completed: false,
                remind: memoReminderToggle.checked,
                remindAt: memoReminderTime.value,
                notified: false
            });

            memoInput.value = "";
            memoReminderToggle.checked = false;
            memoReminderTime.value = "";
            renderMemo();
            saveMemo();
            await requestNotificationPermission();
            memoInput.focus();
        });

        memoClear.addEventListener("click", () => {
            memoItems = [];
            renderMemo();
            saveMemo();
            memoInput.focus();
        });

        renderMemo();
        checkReminders();
        setInterval(checkReminders, 10000);


        function updateCountdown() {

            const now = Date.now();

            const distance =
                concertDate - now;


            /* 到达目标时间 */

            if (distance <= 0) {

                daysElement.textContent = "00";
                hoursElement.textContent = "00";
                minutesElement.textContent = "00";
                secondsElement.textContent = "00";

                messageElement.textContent =
                    "澳门场已经到来 ✦";

                messageElement.classList.add("active");

                return;
            }


            /* 时间计算 */

            const days =
                Math.floor(
                    distance / (1000 * 60 * 60 * 24)
                );

            const hours =
                Math.floor(
                    (distance % (1000 * 60 * 60 * 24))
                    / (1000 * 60 * 60)
                );

            const minutes =
                Math.floor(
                    (distance % (1000 * 60 * 60))
                    / (1000 * 60)
                );

            const seconds =
                Math.floor(
                    (distance % (1000 * 60))
                    / 1000
                );


            /* 更新页面 */

            daysElement.textContent =
                String(days).padStart(2, "0");

            hoursElement.textContent =
                pad(hours);

            minutesElement.textContent =
                pad(minutes);

            secondsElement.textContent =
                pad(seconds);
        }


        /* 立即执行一次 */

        updateCountdown();


        /* 每秒更新 */

        setInterval(updateCountdown, 1000);

    </script>

</body>
